name: Format Check

on:
  push:
  pull_request:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install clang-format==13.0.1

      - name: Check formatting
        # The vendored Bosch BHI385 SensorAPI (bhi385_sensorapi/bhi385* and the Bosch_* firmware image) is kept
        # unmodified and is not formatted.
        run: find components \( -name "*.cpp" -o -name "*.h" \) -not -path "*/bhi385_sensorapi/bhi385*" -not -name "Bosch_*" | xargs clang-format --dry-run --Werror
